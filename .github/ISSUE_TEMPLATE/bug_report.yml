name: 缺陷报告
description: 报告一个可复现的问题（请先读 README 的「故障排查手册」）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。**请先做两件事**，能省下大量来回：

        1. 读一遍 [docs/TROUBLESHOOTING.md](https://github.com/Hayliy/naixi-desktop/blob/main/docs/TROUBLESHOOTING.md)（语音无声、面捕、SearXNG 降级、SmartScreen 提示等高频问题都有现成答案）；
        2. 在应用里跑一次诊断：**顶栏「系统」菜单 → 运行诊断**，把结果贴到下面第 4 项。

        如果问题涉及安全漏洞，请改用 SECURITY.md 里的私密上报渠道，不要开公开 Issue。

  - type: input
    id: version
    attributes:
      label: 版本号
      description: 设置 → 关于，或顶栏显示；也可以从「运行诊断」结果里的 version 字段复制
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: 安装方式
      options:
        - NSIS 安装包（全新安装）
        - NSIS 安装包（覆盖升级）
        - 从源码构建
        - 不确定
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统
      description: 版本号尽量写全（设置 → 系统 → 关于）
      placeholder: "Windows 10 22H2 (19045) / Windows 11 23H2"
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断结果
      description: 顶栏「系统」菜单 → 运行诊断 → 复制结果。若诊断本身打不开或后端起不来，写「无法运行」并说明现象。
      render: json
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从启动应用开始，逐步写清每一步点了什么、输入了什么
      placeholder: |
        1. 启动应用
        2. 打开「知识库」
        3. 点击「导入」并选择 xxx
        4. 出现 yyy
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果与实际结果
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: 复现概率
      options:
        - 每次都发生
        - 偶发（约一半）
        - 只出现过一次
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: |
        安装目录 `resources\logs\` 下的日志，把相关片段贴进来（**先删掉 API Key、Cookie、聊天隐私等敏感内容**）。
        安装目录可从开始菜单「奶昔」右键 → 打开文件位置定位。
      render: text
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我的安装包来自官方 GitHub Releases（不是网盘 / 论坛 / QQ 群转发的版本）
          required: true
        - label: 我已读 README 的「已知问题 / 限制」，确认这不是已声明的行为
          required: true
