    }
  }
  if (r.headEuler) {
    // 前置镜像：表情左右已镜像，头部 yaw/roll 也需同步翻转，否则头部转向与脸的实际方向相反
    const yaw  = FACE_MIRROR ? -r.headEuler.y : r.headEuler.y;
    const roll = FACE_MIRROR ? -r.headEuler.z : r.headEuler.z;
    // 减中性基准（VTS "Set as Center"）：静止时头部回到模型中心，只有相对偏移驱动
    const hbx = _calib ? _calib.head.x : 0, hby = _calib ? _calib.head.y : 0, hbz = _calib ? _calib.head.z : 0;
    // 头部增益：优先读 __vrmFaceConfig 动态设的 faceTracker.cfg.headGain（分轴 {x,y,z}），缺省回退 0.8。
    // ⚠ 旧写法没乘 headGain → 调「头部灵敏度」完全不生效，必须乘在减基准后的目标值上再平滑。
    const hg = (faceTracker && faceTracker.cfg && faceTracker.cfg.headGain) ? faceTracker.cfg.headGain : FACE_CFG.headGain;
    smoothHead.x += (((r.headEuler.x - hbx) * hg.x) - smoothHead.x) * headK;
    smoothHead.y += (((yaw  - hby) * hg.y) - smoothHead.y) * headK;
    smoothHead.z += (((roll - hbz) * hg.z) - smoothHead.z) * headK;
    // idle 呼吸微动（<1°、双频率慢波）：面捕静止时也有生命感，动作时被面捕值主导不察觉
    const idleY = t != null ? Math.sin(t * 0.9) * 0.012 + Math.sin(t * 0.37 + 1.3) * 0.008 : 0;
    const idleX = t != null ? Math.sin(t * 0.63 + 0.5) * 0.010 : 0;
    const hx = smoothHead.x + idleX, hy = smoothHead.y + idleY;
    // 桌宠窗口小，头转动过大会让脸/头发直接甩出画面；限制到桌宠自然范围（VTS 默认也类似）
    const HEAD_LIMIT = { pitch: 0.44, yaw: 0.61, roll: 0.26 }; // 25° / 35° / 15°
    const clamp = (v, lo, hi) => (hi !== undefined ? Math.max(lo, Math.min(hi, v)) : Math.max(-lo, Math.min(lo, v)));
    const cx = clamp(hx, HEAD_LIMIT.pitch);
    const cy = clamp(hy, HEAD_LIMIT.yaw);
    const cz = clamp(smoothHead.z, HEAD_LIMIT.roll);
    const head = vrm.humanoid ? vrm.humanoid.getNormalizedBoneNode('head') : null;
    setRotSafe(head, cx, cy, cz);

    // 躯干：优先用 Pose 肩-髋向量捕捉前倾/侧倾（摄像头驱动）；Pose 缺失时回落「跟随头」
    const chest = vrm.humanoid && (vrm.humanoid.getNormalizedBoneNode('upperChest') || vrm.humanoid.getNormalizedBoneNode('chest'));
    const spine = vrm.humanoid && (vrm.humanoid.getNormalizedBoneNode('spine') || vrm.humanoid.getNormalizedBoneNode('lowerChest'));
    if (r.pose) {
      const torso = torsoToVRM(r.pose, {
        mirror: FACE_MIRROR,
        torsoGain: POSE_DEFAULTS.torsoGain,
        torsoPitchGain: POSE_DEFAULTS.torsoPitchGain,
        torsoRollGain: POSE_DEFAULTS.torsoRollGain,
        torsoYawGain: POSE_DEFAULTS.torsoYawGain,
        torsoCalib: _calib ? _calib.torso : null,   // 减中性基准：静止时 chest 回到中心
      });
      // 用户点「重置面捕原点」时，把当前姿态采为中性基准（手动，不自动锁）
      _calibTick(r.headEuler, torso._raw);
      // 躯干左右转走 **Pose 真实捕捉**（肩线 z 分量差 → 躯干朝向），
      // 不再用「头部 yaw × 系数」顶替 —— 后者在真人只转身不转头时躯干完全不动（用户实锤"只是被带动的模拟"）。
      // 仅保留 0.15 的头带动：兜住 Pose 抖动，同时让静止时躯干随头部 idle 微动呼吸。
      const tyaw = clamp((isFinite(torso.yaw) ? torso.yaw : 0) + cy * 0.15, -0.5, 0.5);
      const tp = isFinite(torso.pitch) ? clamp(torso.pitch, -0.35, 0.35) : 0;
      const tr = isFinite(torso.roll) ? clamp(torso.roll, -0.35, 0.35) : 0;
      setRotSafe(chest, tp + cx * 0.1, tyaw, tr + cz * 0.1);
      if (spine && spine !== chest) setRotSafe(spine, tp * 0.6, tyaw * 0.6, tr * 0.6);
      // [CHEST] 调试日志已移除（自验期用于确认 torsoGain 生效，现灵敏度已验证通过）
    } else {
      if (_recenterRequested) console.log('[CALIB] 重校中：当前帧未检测到身体姿态，请在画面中保持上半身入镜');
      // 修复：chestPitchGain/chestRollGain 此前未定义 → cx*undefined=NaN → setRotSafe 早退 → chest 卡 rest pose
      const cp = POSE_DEFAULTS.chestPitchGain ?? 0.5;
      const cr = POSE_DEFAULTS.chestRollGain ?? 0.5;
      setRotSafe(chest, cx * cp, cy * POSE_DEFAULTS.chestYawGain, cz * cr);
      if (spine && spine !== chest) setRotSafe(spine, cx * 0.15, cy * 0.20, cz * 0.15);
      // [CHEST] 调试日志已移除（自验期用于确认 torsoGain 生效，现灵敏度已验证通过）
    }
  }
  // 手臂（Pose）：3D 方向对齐 + 平滑；肘/腕不可见（出画/低置信度）的侧不驱动
  if (r.pose) {
    _driveArmsFromPose(r.pose, r.poseVis, armK);
  }
}

/**
 * 用一份 Pose 数据驱动双臂 —— 真实链路的唯一入口。
 * 抽成函数是为了让无头自验能绕过摄像头直接注入合成 Pose（window.__vrmPoseInject）：
 * 「方向对不对」如果只能靠用户坐到镜头前肉眼判断，就既无法自证也无法回归，
 * 只能陷入「用户说反 → AI 猜 → 又反」的循环（2026-08-30 已反复踩过）。
 */
function _driveArmsFromPose(pose, vis, armK) {
  // vis 必传：Pose 置信度门控（低置信/关键点丢失的帧不驱动手臂，防抽搐）
  const dirs = poseArmDirections(pose, { mirror: FACE_MIRROR, zSign: POSE_DEFAULTS.zSign, xSign: POSE_DEFAULTS.xSign, vis });
  const applySide = (key, sideSign, up, lo, hand) => {
    if (!(dirs[key].visible && up && lo && hand)) { _armSmooth[key] = null; _armTgt[key] = null; return; }
    _armSmooth[key] = {
      u: _smoothVec(_armSmooth[key] && _armSmooth[key].u, dirs[key].u, armK),
      l: _smoothVec(_armSmooth[key] && _armSmooth[key].l, dirs[key].l, armK),
    };
    // 记录本帧「目标方向」，供每秒一次的肘部自检对比模型实际骨骼方向
    _armTgt[key] = { u: { ..._armSmooth[key].u }, l: { ..._armSmooth[key].l } };
    poseOneArmDir(up, lo, hand, sideSign, _armSmooth[key].u, _armSmooth[key].l);
  };
  applySide('left', +1, bone('leftUpperArm'), bone('leftLowerArm'), bone('leftHand'));
  applySide('right', -1, bone('rightUpperArm'), bone('rightLowerArm'), bone('rightHand'));
  _zAutoCalib(dirs);
  _xAutoCalib(dirs);
  _poseCheckLog();
  return dirs;
}

async function startFaceCapture(opts = {}) {
  if (!faceTracker) faceTracker = new FaceTracker({ mirror: FACE_MIRROR, expressionGain: FACE_GAIN, ...opts });
  await faceTracker.start(opts);
  faceEnabled = true;
  // 方向自校准窗口（默认 15s）：只在刚开启这段时间允许翻转 zSign/xSign，超时没攒够样本就放弃本轮
  _calibDeadline = performance.now() + (opts.calibWindowMs ?? 15000);
  console.log('[VRM] 面捕已开启：表情+头部由摄像头驱动，身体待机静止（不自动播放动作轨）');
  return true;
}

function stopFaceCapture() {
  faceEnabled = false;
  if (faceTracker) faceTracker.stop();
  // 停了要把面捕写进去的表情清零，否则会挂着最后一帧的鬼脸不放
  if (vrm && vrm.expressionManager) for (const k in faceLastExpr) vrm.expressionManager.setValue(k, 0);
  faceLastExpr = {};
  console.log('[VRM] 面捕已关闭');
}

if (FACE) {
  // 浏览器策略：getUserMedia 可能需要用户手势或尚未授权；失败保留手动入口 __vrmFaceStart()
  startFaceCapture().catch((e) => console.warn('[VRM] 面捕自动启动失败，可手动调用 __vrmFaceStart():', e.message));
}

// ── 自动表情：跳舞/有动作时脸上要有表情，避免面瘫；手动表情(__vrmSetEmotion)/面捕优先 ──
const _autoExprNames = ['happy', 'angry', 'sad', 'relaxed', 'surprised'];
let _autoExprName = null;
let _autoExprHoldUntil = 0;
let _autoBlinkLeft = 0;
let _autoNextBlink = 2.5;
const _autoExprTargets = Object.fromEntries(_autoExprNames.map((e) => [e, 0]));
const _autoExprValues  = Object.fromEntries(_autoExprNames.map((e) => [e, 0]));
function _autoExpr(dt) {
  if (!vrm || !vrm.expressionManager) return;
  if (expressionName || faceEnabled) {        // 手动表情 / 面捕优先
    // 淡出当前自动表情，避免和手动/面捕打架
    const speed = Math.min(1, dt * 10);
    for (const e of _autoExprNames) {
      _autoExprValues[e] += (0 - _autoExprValues[e]) * speed;
      if (Math.abs(_autoExprValues[e]) < 0.001) _autoExprValues[e] = 0;
      vrm.expressionManager.setValue(e, _autoExprValues[e]);
    }
    // 面捕/手动表情时保留自然眨眼（与面捕眨眼取 max）：MediaPipe 眨眼不稳时脸不会长时间不眨、显僵硬
    if (_autoBlinkLeft > 0) _autoBlinkLeft -= dt;
    else if (performance.now() / 1000 > _autoNextBlink) { _autoBlinkLeft = 0.12; _autoNextBlink = performance.now() / 1000 + 2.5 + Math.random() * 2.5; }
    if (vrm.expressionManager.getValue) {
      const fb = vrm.expressionManager.getValue('blink') || 0;
      vrm.expressionManager.setValue('blink', Math.max(fb, _autoBlinkLeft > 0 ? 1 : 0));
    }
    return;
  }
  const now = performance.now() / 1000;
  const active = !!activeMotion || danceMode;
  // 情绪：每 1.5~4s 随机切换目标，但数值会做平滑过渡，避免脸上“闪一下”
  if (now > _autoExprHoldUntil) {
    const pool = active ? ['happy', 'surprised', 'relaxed', 'happy'] : ['relaxed', 'relaxed', 'happy'];
    _autoExprName = pool[Math.floor(Math.random() * pool.length)];
    _autoExprHoldUntil = now + 1.5 + Math.random() * 2.5;
    for (const e of _autoExprNames) _autoExprTargets[e] = (e === _autoExprName ? 0.85 : 0);
  }
  const speed = Math.min(1, dt * 10);
  for (const e of _autoExprNames) {
    _autoExprValues[e] += (_autoExprTargets[e] - _autoExprValues[e]) * speed;
    if (Math.abs(_autoExprValues[e]) < 0.001) _autoExprValues[e] = 0;
    vrm.expressionManager.setValue(e, _autoExprValues[e]);
  }
  // 自然眨眼：每 2.5~5s 一次，闭眼约 0.12s
  if (_autoBlinkLeft > 0) _autoBlinkLeft -= dt;
  else if (now > _autoNextBlink) { _autoBlinkLeft = 0.12; _autoNextBlink = now + 2.5 + Math.random() * 2.5; }
  vrm.expressionManager.setValue('blink', _autoBlinkLeft > 0 ? 1 : 0);
}

// ── 肘部自检（数据模型，2026-08-30）──
// 把"肘部动作反"从主观描述变成数字：对比「目标方向」与「模型骨骼实际方向」。
//   上臂误差 / 前臂误差 大 → 骨骼没转到目标（执行层问题）；
//   肘弯(目标 vs 实际) 差很多 → 弯曲程度不对；两者都小 → 问题在目标方向本身（坐标/符号）。
function _elbowAudit() {
  if (!vrm || !vrm.humanoid) return;
  const defs = [
    ['left', 'leftUpperArm', 'leftLowerArm', 'leftHand'],
    ['right', 'rightUpperArm', 'rightLowerArm', 'rightHand'],
  ];
  const parts = [];
  for (const [key, upN, loN, handN] of defs) {
    const t = _armTgt[key];
    const up = bone(upN), lo = bone(loN), hand = bone(handN);
    if (!up || !lo || !hand) { parts.push(`${key}: humanoid 骨骼缺失`); continue; }
    if (!t) { parts.push(`${key}: 本秒未驱动（Pose 不可见 / 被置信度门控）`); continue; }
    const actU = worldPosOf(lo).sub(worldPosOf(up));
    const actL = worldPosOf(hand).sub(worldPosOf(lo));
    if (actU.lengthSq() < 1e-12 || actL.lengthSq() < 1e-12) continue;
    actU.normalize(); actL.normalize();
    const tgtU = new THREE.Vector3(t.u.x, t.u.y, t.u.z);
    const tgtL = new THREE.Vector3(t.l.x, t.l.y, t.l.z);
    if (tgtU.lengthSq() < 1e-12 || tgtL.lengthSq() < 1e-12) continue;
    tgtU.normalize(); tgtL.normalize();
    const errU = THREE.MathUtils.radToDeg(actU.angleTo(tgtU));
    const errL = THREE.MathUtils.radToDeg(actL.angleTo(tgtL));
    const bendTgt = THREE.MathUtils.radToDeg(tgtU.angleTo(tgtL));
    const bendAct = THREE.MathUtils.radToDeg(actU.angleTo(actL));
    // 反关节检测：肘是铰链关节，前臂只能朝上臂「前侧」弯。
    // 取前臂相对上臂的垂直分量，其世界 Z（朝相机=身体前方）若为正 = 正常弯曲；为负 = 反折（反关节）。
    const perpT = tgtL.clone().sub(tgtU.clone().multiplyScalar(tgtL.dot(tgtU)));
    const perpA = actL.clone().sub(actU.clone().multiplyScalar(actL.dot(actU)));
    const flag = (perpA.z < -0.02) ? ' ⚠反关节' : '';
    parts.push(`${key}: 上臂误差=${errU.toFixed(0)}° 前臂误差=${errL.toFixed(0)}° 肘弯目标/实际=${bendTgt.toFixed(0)}°/${bendAct.toFixed(0)}° 弯曲朝前(Z)目标/实际=${perpT.z.toFixed(2)}/${perpA.z.toFixed(2)}${flag}`);
  }
  if (parts.length) console.log('[ELBOW] ' + parts.join(' | '));
}

// ── 坐标轴一致性自检（2026-08-30）──
// 前面所有自检都在验证「模型有没有跟上目标」，**无法发现目标本身算反了**
// （目标反 + 模型忠实执行 = 误差 0°，看着一切正常，但真人和模型动作相反）。
// 这里直接把「MediaPipe 原始数据」和「模型骨骼世界坐标」摆在一起对照：
//   MP: 右腕-左腕 的 x/y/z   vs   MODEL: 右腕-左腕 的 x/y
// 判据：两者符号应一致。若相反 → 目标方向算反了（x/y/z 某个轴取反错）。
function _axisAudit() {
  if (!vrm || !vrm.humanoid || !faceTracker || !faceTracker.result) return;
  const r = faceTracker.result;
  if (!r.pose || r.pose.length < 25) return;
  const P = r.pose;
  const nose = P[0], wl = P[15], wr = P[16], hipL = P[23], hipR = P[24];
  if (!nose || !wl || !wr || !hipL || !hipR) return;
  const hipMidY = (hipL.y + hipR.y) / 2;
  const mpYup = (nose.y - hipMidY) > 0;   // MediaPipe world 坐标 y 是否「向上为正」
  // 【2026-08-30 重写】旧版只输出「腕差」这个二次加工量，无法判定坐标轴真实朝向，
  // 导致符号推导全靠纸上假设、改一处翻一处。现在直接 dump **原始坐标**，让数据自己说话。
  // 判定手册（真人面对摄像头、MediaPipe 索引 L=图像左=真人右侧）：
  //   world x 若「图像右为正」→ 真人左肩(12).x > 0 > 真人右肩(11).x
  //   world x 若「被摄者右为正」→ 真人右肩(11).x > 0 > 真人左肩(12).x  ← 真机已观察到此形态
  //   y：nose.y < hip.y ⇒ y 向下为正（图像式），conv 的 y 取反正确
  const f = (p) => (p ? `${p.x >= 0 ? '+' : ''}${p.x.toFixed(2)},${p.y >= 0 ? '+' : ''}${p.y.toFixed(2)},${p.z >= 0 ? '+' : ''}${p.z.toFixed(2)}` : '-');
  const mw = (n) => { const b = bone(n); if (!b) return '-'; const v = worldPosOf(b); return `${v.x >= 0 ? '+' : ''}${v.x.toFixed(2)},${v.y >= 0 ? '+' : ''}${v.y.toFixed(2)},${v.z >= 0 ? '+' : ''}${v.z.toFixed(2)}`; };
  console.log(`[AXIS] MP y向上=${mpYup} | 真人右肩11=${f(P[11])} 真人左肩12=${f(P[12])} 真人右腕15=${f(P[15])} 真人左腕16=${f(P[16])}`);
  console.log(`[AXIS] MODEL(世界) 左肩=${mw('leftUpperArm')} 右肩=${mw('rightUpperArm')} 左腕=${mw('leftHand')} 右腕=${mw('rightHand')}`);
  // 头部/躯干对照：真人转头与侧倾的**原始指示量** vs 模型实际旋转值，一次拿全，避免逐关节试错。
  //   真人转头指示 = 鼻(0).x - 肩中点.x：真人向自己右侧转头时鼻子偏向他的右手方向
  //     （MP x 以真人右为正 ⇒ 指示量变大）。模型头 yaw>0 = 转向 +X = 模型的 left 侧，
  //     而真人向右转时镜中像应转向模型 right ⇒ **模型 yaw 应与指示量反号**。
  //   真人侧倾指示 = 真人左肩12.y - 真人右肩11.y：y 向下为正 ⇒ 正值 = 左肩更低 = 身体向左倾。
  const shMidX = (P[11] && P[12]) ? (P[11].x + P[12].x) / 2 : null;
  const headTurn = (nose && shMidX != null) ? (nose.x - shMidX) : null;
  // 躯干三轴指示量（都用肩宽归一化，与距离无关；与 torsoToVRM 的输入严格同源，便于直接比对）
  //   转体指示 = (真人右肩11.z - 真人左肩12.z)/肩宽 ：正 = 真人转向自己的右侧
  //   前倾指示 = 肩中点z - 髋中点z                ：负 = 真人朝相机前倾（z 越小越靠近相机）
  //   侧倾指示 = (真人左肩12.y - 真人右肩11.y)/肩宽 ：正 = 真人左肩更低 = 向左倾
  const sp = (P[11] && P[12]) ? (Math.hypot(P[12].x - P[11].x, P[12].y - P[11].y, P[12].z - P[11].z) || 1e-6) : 1e-6;
  const lean = (P[11] && P[12]) ? ((P[12].y - P[11].y) / sp) : null;
  const torsoTurn = (P[11] && P[12]) ? ((P[11].z - P[12].z) / sp) : null;
  const shMidZ = (P[11] && P[12]) ? (P[11].z + P[12].z) / 2 : null;
  const hpMidZ = (P[23] && P[24]) ? (P[23].z + P[24].z) / 2 : null;
  const torsoFwd = (shMidZ != null && hpMidZ != null) ? (shMidZ - hpMidZ) : null;
  const hd = bone('head'), ch = bone('upperChest') || bone('chest');
  const rot = (n) => { if (!n) return '-'; return `x=${n.rotation.x.toFixed(2)} y=${n.rotation.y.toFixed(2)} z=${n.rotation.z.toFixed(2)}`; };
  console.log(`[AXIS] 头 真人转头指示=${headTurn == null ? '-' : headTurn.toFixed(3)} headEuler=${r.headEuler ? `x=${r.headEuler.x.toFixed(2)} y=${r.headEuler.y.toFixed(2)} z=${r.headEuler.z.toFixed(2)}` : '-'}`
    + ` || MODEL head ${rot(hd)}`);
  console.log(`[AXIS] 躯干 转体=${torsoTurn == null ? '-' : torsoTurn.toFixed(3)} 前倾=${torsoFwd == null ? '-' : torsoFwd.toFixed(3)} 侧倾=${lean == null ? '-' : lean.toFixed(3)}`
    + ` || MODEL chest ${rot(ch)}`);
}

// ── NaN 自愈（2026-08-30）──
// NaN 一旦写进骨骼/表情就会永久残留，表现为"某些部件突然消失且再也回不来"。
// 检测到顶点 NaN 后统一复位：表情清零 + humanoid/gender 复位 + 弹簧骨重置 + 面捕平滑清空。
function _nanHeal(reason) {
  console.log('[NAN-HEAL] 检测到顶点 NaN（' + reason + '），执行自愈复位');
  try {
    for (const k in faceLastExpr) faceLastExpr[k] = 0;
    if (vrm && vrm.expressionManager) {
      try {
        for (const e of (vrm.expressionManager.expressions || [])) {
          const nm = e.expressionName || e.name;
          vrm.expressionManager.setValue(nm, 0);
        }
      } catch (e) {}
    }
    _armSmooth.left = null;
    _armSmooth.right = null;
    smoothHead.x = 0; smoothHead.y = 0; smoothHead.z = 0;
    if (vrm && vrm.humanoid) vrm.humanoid.resetNormalizedPose();
    try { if (vrm && vrm.springBoneManager && vrm.springBoneManager.reset) vrm.springBoneManager.reset(); } catch (e) {}
    applyRestPose();
    vrm.scene.updateMatrixWorld(true);
    _nanReported = {};   // 允许复位后若再次 NaN 重新 dump 根因
  } catch (e) {
    console.log('[NAN-HEAL] 复位失败: ' + e.message);
  }
}

// ── 渲染自检「数据模型」（2026-08-30 新增）──
// 目的：把"缺斤少两"从肉眼描述变成可量化指标，让代码自己回答
//   「哪个 mesh 缺了 / 是被视锥裁掉、还是骨骼解算炸了(NaN)、还是被显式隐藏」。
// 做法：对每个 mesh 采样顶点 → 应用蒙皮(boneTransform) → 转世界坐标 → 投影到 NDC，
//       统计是否超出 [-1,1]（= GPU 会裁掉）与是否 NaN。每秒跑一次，不每帧，不影响帧率。
let _auditLast = 0;
let _auditWorst = {};   // 累积「该 mesh 本次会话中出现过的最大越界方向」，便于事后归因
let _nanReported = {};  // 每个 mesh 的 NaN 根因只 dump 一次，避免刷屏
let _nanHealLast = 0;   // 自愈节流时间戳
function _renderAudit() {
  const nowMs = performance.now();
  if (nowMs - _auditLast < 1000) return;
  _auditLast = nowMs;
  if (!vrm || !vrm.scene || !camera) return;
  vrm.scene.updateMatrixWorld(true);
  const clipped = [], nanList = [], invisible = [];
  const v = new THREE.Vector3();
  vrm.scene.traverse((obj) => {
    if (!(obj.isSkinnedMesh || obj.isMesh)) return;
    const pos = obj.geometry && obj.geometry.attributes && obj.geometry.attributes.position;
    if (!pos || !pos.count) return;
    const nm = obj.name || '(unnamed)';
    if (obj.visible === false) { invisible.push(nm); return; }
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity, maxZ = -Infinity;
    let hasNaN = false;
    const step = Math.max(1, Math.floor(pos.count / 512));   // 每个 mesh 最多采样 512 点（太稀会漏报局部裁剪）
    for (let i = 0; i < pos.count; i += step) {
      v.fromBufferAttribute(pos, i);
      if (obj.isSkinnedMesh) {
        try {
          if (typeof obj.applyBoneTransform === 'function') obj.applyBoneTransform(i, v);
          else if (typeof obj.boneTransform === 'function') obj.boneTransform(i, v);
        } catch (e) { hasNaN = true; break; }
      }
      obj.localToWorld(v);
      if (!isFinite(v.x) || !isFinite(v.y) || !isFinite(v.z)) { hasNaN = true; break; }
      const p = v.clone().project(camera);
      if (p.x < minX) minX = p.x;
      if (p.x > maxX) maxX = p.x;
      if (p.y < minY) minY = p.y;
      if (p.y > maxY) maxY = p.y;
      if (p.z > maxZ) maxZ = p.z;
    }
    if (hasNaN) {
      nanList.push(nm);
      // 一次性根因 dump：找出到底是哪个骨骼的 quaternion / position / matrixWorld 炸成 NaN
      if (!_nanReported[nm]) {
        _nanReported[nm] = true;
        const bad = [];
        const sk = obj.skeleton;
        if (sk && sk.bones) {
          for (const b of sk.bones) {
            const q = b.quaternion, p = b.position, s = b.scale;
            const qOK = isFinite(q.x) && isFinite(q.y) && isFinite(q.z) && isFinite(q.w);
            const pOK = isFinite(p.x) && isFinite(p.y) && isFinite(p.z);
            const sOK = isFinite(s.x) && isFinite(s.y) && isFinite(s.z);
            if (!(qOK && pOK && sOK)) bad.push(`${b.name}[q=${qOK ? 'ok' : 'NaN'} p=${pOK ? 'ok' : 'NaN'} s=${sOK ? 'ok' : 'NaN'}]`);
          }
        }
        console.log(`[NaN-ROOT] mesh=${nm} 坏骨骼: ${bad.length ? bad.join(', ') : '（骨骼都正常 → 顶点/skinIndex/skeleton.boneMatrices 问题）'}`);
      }
      return;
    }
    const out = [];
    if (minY < -1) out.push('bottom(' + minY.toFixed(2) + ')');
    if (maxY > 1) out.push('top(' + maxY.toFixed(2) + ')');
    if (minX < -1) out.push('left(' + minX.toFixed(2) + ')');
    if (maxX > 1) out.push('right(' + maxX.toFixed(2) + ')');
    if (maxZ > 1) out.push('far(' + maxZ.toFixed(2) + ')');
    if (out.length) {
      clipped.push(nm + ':' + out.join(','));
      // 累积最坏情况（按 mesh 名），方便事后看「到底哪个部件最容易甩出去」
      const w = _auditWorst[nm] || (_auditWorst[nm] = { bottom: 0, top: 0, left: 0, right: 0, far: 0 });
      if (minY < -1) w.bottom = Math.min(w.bottom, minY);
      if (maxY > 1) w.top = Math.max(w.top, maxY);
      if (minX < -1) w.left = Math.min(w.left, minX);
      if (maxX > 1) w.right = Math.max(w.right, maxX);
      if (maxZ > 1) w.far = Math.max(w.far, maxZ);
    }
  });
  // 自愈：NaN 会永久残留，必须主动复位（节流 3s，避免每帧复位导致画面抽搐）
  if (nanList.length && nowMs - (_nanHealLast || 0) > 3000) {
    _nanHealLast = nowMs;
    _nanHeal(nanList.length + ' 个 mesh');
  }
  // 表情诊断：面捕写入的 blendshape 若越界（>1 / <0）会让 mesh 顶点被 morph 拉飞，形状"缺块"
  const exprs = [];
  try {
    const em = vrm.expressionManager;
    const list = (em && em.expressions) || [];
    for (const e of list) {
      const nm = e.expressionName || e.name;
      let val = 0;
      try { val = em.getValue ? em.getValue(nm) : (em.getWeight ? em.getWeight(nm) : 0); } catch (err) { val = 0; }
      if (val && Math.abs(val) > 0.05) exprs.push(nm + '=' + val.toFixed(2));
    }
  } catch (e) {}
  // 半透明部件清单：transparent 材质最容易因排序/深度变化"看起来消失"
  const semi = [];
  vrm.scene.traverse((obj) => {
    if (!(obj.isMesh || obj.isSkinnedMesh)) return;
    const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
    for (const m of mats) if (m && m.transparent) { semi.push(obj.name || '(unnamed)'); break; }
  });
  // 「会话最坏值」：用户动作是瞬时的，1 秒采样可能正好错过越界那一帧；
  // 累积后即便当前帧 clipped=0，也能看到本轮是否曾经越界、越了多少。
  const wkeys = Object.keys(_auditWorst);
  const worstStr = wkeys.length
    ? wkeys.map((k) => k + ':' + JSON.stringify(_auditWorst[k])).join(' | ')
    : '';
  console.log(`[AUDIT] clipped=${clipped.length} nan=${nanList.length} invisible=${invisible.length} semi=${semi.length}` +
    (clipped.length ? `\n  CLIP: ${clipped.join(' | ')}` : '') +
    (nanList.length ? `\n  NaN: ${nanList.join(' | ')}` : '') +
    (exprs.length ? `\n  EXPR: ${exprs.join(' ')}` : '') +
    (worstStr ? `\n  WORST: ${worstStr}` : ''));
  try { document.body.dataset.audit = JSON.stringify({ clipped, nan: nanList, invisible, semi, exprs }); } catch (e) {}
  _elbowAudit();   // 肘部方向自检（上臂/前臂误差 + 肘弯曲角目标 vs 实际）
  _axisAudit();    // 坐标轴一致性自检（真人原始数据 vs 模型骨骼，判定目标是否整体反了）
}
window.__vrmAuditWorst = () => _auditWorst;   // 供外部一次性取累积最坏值归因

let _fpsAccum = 0, _fpsFrames = 0, _fpsLast = 0;
function frame() {
  requestAnimationFrame(frame);
  // clamp delta：掉帧/卡顿时若把超大 dt 喂给 vrm.update，弹簧物理会瞬间爆炸、越卡越糟（业界 90% 掉帧根因）
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  // FPS 探针：每 ~1s 打印一次实际帧率，方便排查卡顿
  _fpsAccum += dt; _fpsFrames++;
  if (_fpsAccum >= 1 && _fpsLast !== Math.floor(t)) { _fpsLast = Math.floor(t); console.log('[FPS] ' + Math.round(_fpsFrames / _fpsAccum)); _fpsAccum = 0; _fpsFrames = 0; }
  if (vrm) {
    mouthValue += (targetMouth - mouthValue) * Math.min(1, dt * 18);
    if (vrm.expressionManager) vrm.expressionManager.setValue('aa', mouthValue);
    _autoExpr(dt);
    if (activeMotion) {
      activeMotion.t += dt;
      if (activeMotion.t >= activeMotion.dur) {
        activeMotion = null;
        if (danceMode) {
          nextDance();
        } else {
          if (currentAction) { currentAction.stop(); currentAction = null; }
          if (savedHipsPos) { const h = bone('hips'); if (h) h.position.copy(savedHipsPos); savedHipsPos = null; }
          applyRestPose();   // 回到双臂自然下垂静止站姿
        }
      }
    }
    if (mixer) mixer.update(dt);   // 驱动 idle / 真实 VRMA 动作 clip
    if (activeMotion && activeMotion.stripArms) {
      // 循环模式保留 hips Y（深蹲/跳跃的垂直动作），但把 X/Z 锁回初始位置，避免角色走离画面中心
      const hips = bone('hips');
      if (hips && savedHipsPos) hips.position.set(savedHipsPos.x, hips.position.y, savedHipsPos.z);
      applyProceduralArmSwing(clock.elapsedTime);
    }
    if (activeMotion && activeMotion.procedural) {
      applyProceduralFullBody(clock.elapsedTime);
    }
    applyFaceCapture(dt, t);   // 面捕：覆盖表情与头部（必须在 mixer.update 之后，否则会被 VRMA 动作轨冲掉）
    vrm.update(dt);
    _syncDualBones();     // 双骨骼 rig：把控制骨世界变换同步到蒙皮变形骨，让腿真正形变
    if (prevAction && clock.elapsedTime >= _fadeUntil) { prevAction.stop(); prevAction = null; }
    _renderAudit();   // 每秒量化自检：哪些 mesh 被视锥裁掉 / NaN / 隐藏
  }
  renderer.render(scene, camera);
}
frame();

// ── 对外 API ──
window.__vrmSetEmotion = (name) => {
  expressionName = name;
  if (vrm && vrm.expressionManager) {
    for (const e of ['happy', 'angry', 'sad', 'relaxed', 'surprised']) vrm.expressionManager.setValue(e, e === name ? 1 : 0);
    console.log('[VRM] emotion ->', name);
  }
};
window.__vrmSetMouth = (v) => { targetMouth = Math.max(0, Math.min(1, v)); };
window.__vrmResetExpr = () => {
  expressionName = null;
  if (vrm && vrm.expressionManager) for (const e of ['happy', 'angry', 'sad', 'relaxed', 'surprised']) vrm.expressionManager.setValue(e, 0);
};
window.__vrmPlayMotion = (name) => playMotion(name);
window.__vrmStopMotion = () => {
  activeMotion = null;
  if (currentAction) { currentAction.stop(); currentAction = null; }
  if (idleAction) idleAction.paused = false;
  applyRestPose();
};
window.__vrmGetMotion = () => activeMotion ? activeMotion.name : null;
// 右键菜单用：无限循环播放某个动作 / 启动舞蹈合集
window.__vrmLoop = (name) => startLoopMotion(name);
window.__vrmStartDance = () => startDance();
window.__vrmReady = () => !!vrm;
window.__vrmGetExpr = () => expressionName;
window.__vrmGetMouth = () => mouthValue;

// ── 裙摆遮挡：本模型(鸣潮秧秧玄翎)有多层裙摆材质(B最外摆/B内摆/MI_Cloth…)，
//    腿在骨骼层面确实在动，但视觉上被裙摆完全盖住，肉眼只看得到"整体在上下移动"。
//    提供开关把裙摆隐藏，露出腿部，便于核对腿部动作是否真的生效。 ──
const SKIRT_MAT_KEYWORDS = ['最外摆', '内摆', '摆', 'cloth', 'skirt', 'dress'];
let _skirtMeshes = null;
function _collectSkirtMeshes() {
  if (_skirtMeshes || !vrm || !vrm.scene) return _skirtMeshes || [];
  const found = [];
  vrm.scene.traverse((o) => {
    if (!o.isMesh) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    const hit = mats.some((m) => m && m.name &&
      SKIRT_MAT_KEYWORDS.some((k) => String(m.name).toLowerCase().includes(k.toLowerCase())));
    if (hit) found.push(o);
  });
  _skirtMeshes = found;
  return found;
}
window.__vrmHideSkirt = (hide = true) => {
  const list = _collectSkirtMeshes();
  list.forEach((m) => { m.visible = !hide; });
  console.log(`[VRM] 裙摆网格 ${list.length} 个 -> ${hide ? '已隐藏(露出腿部)' : '已恢复'}`);
  return list.length;
};
window.__vrmSkirtInfo = () => _collectSkirtMeshes().map((m) => {
  const mats = Array.isArray(m.material) ? m.material : [m.material];
  return { name: m.name, mats: mats.map((x) => x && x.name), visible: m.visible };
});
// 面捕对外接口：start/stop 供 UI 或外部脚本调用，status 用于自验，config 用于实机调参
window.__vrmFaceStart = (opts) => startFaceCapture(opts || {}).catch((e) => { console.error('[VRM] 面捕启动失败:', e && e.message); return false; });
window.__vrmFaceStop = () => stopFaceCapture();
window.__vrmFaceStatus = () => (faceTracker ? faceTracker.getDiagnostics() : { running: false, reason: '未初始化' });
window.__vrmFaceConfig = (cfg = {}) => {
  // 始终同步到 FACE_CFG fallback（faceTracker 未初始化 / 无头自验时也能调灵敏度）
  if (cfg.headGain) Object.assign(FACE_CFG.headGain, cfg.headGain);
  if (cfg.headSign) Object.assign(FACE_CFG.headSign, cfg.headSign);
  if (cfg.headLimitRad) Object.assign(FACE_CFG.headLimitRad, cfg.headLimitRad);
  if (cfg.smoothing != null) FACE_CFG.smoothing = cfg.smoothing;
  if (cfg.headSmoothing != null) FACE_CFG.headSmoothing = cfg.headSmoothing;
  if (cfg.expressionGain != null) FACE_CFG.expressionGain = cfg.expressionGain;
  // 真机有 faceTracker 时同步到其实例（applyFaceCapture 优先读 faceTracker.cfg）
  if (faceTracker) {
    if (cfg.headGain) Object.assign(faceTracker.cfg.headGain, cfg.headGain);
    if (cfg.headSign) Object.assign(faceTracker.cfg.headSign, cfg.headSign);
    if (cfg.headLimitRad) Object.assign(faceTracker.cfg.headLimitRad, cfg.headLimitRad);
    if (cfg.smoothing != null) faceTracker.cfg.smoothing = cfg.smoothing;
    if (cfg.headSmoothing != null) faceTracker.cfg.headSmoothing = cfg.headSmoothing;
    if (cfg.expressionGain != null) faceTracker.cfg.expressionGain = cfg.expressionGain;
    return { headGain: faceTracker.cfg.headGain, headSign: faceTracker.cfg.headSign, smoothing: faceTracker.cfg.smoothing };
  }
  return { headGain: FACE_CFG.headGain, headSign: FACE_CFG.headSign, expressionGain: FACE_CFG.expressionGain };
};
// 身体姿态（Pose）调参：armGain 手臂增益、armSign 手臂方向（反了设 -1）、躯干捕捉比例、faceSmooth 平滑系数
// z 方向会自校准（_zAutoCalib）并持久化到 localStorage，一般无需手动设
// 校准值带版本号：坐标推导修过（flipX 修正 + Pose 置信度门控）之后，之前按旧推导校准出来的
// zSign/xSign 已不可信，留着会让手臂方向一直反。版本不匹配就丢弃旧值，按新推导重新校准。
// v4（2026-08-30）：_xAutoCalib 的左右先验曾写反（认为模型 left 在 -X，实测在 +X），
//   于是把「完全正确」的外展方向判成 100% 朝内 → 翻转 xSign 并**持久化**到 localStorage。
//   后果：用户只要抬过几次手，xSign 就被存成 -1，之后每次启动都读它 → 手臂方向一直反
//   （即「怎么改都是反的」的真因）。必须升版本清空，否则修了代码、重启后照样反。
// v5（2026-08-30）：MP world 的 x 实测是「真人自身右为正」，与旧推导「图像右为正」相反，
//   故 xSign 默认值 1 → -1。旧校准值必须清掉，否则残留的 +1 会继续让手臂左右反。
const POSE_CALIB_VER = '5';
try {
  const v = localStorage.getItem('naixi_pose_calib_ver');
  if (v !== POSE_CALIB_VER) {
    localStorage.removeItem('naixi_pose_zsign');
    localStorage.removeItem('naixi_pose_xsign');
    localStorage.setItem('naixi_pose_calib_ver', POSE_CALIB_VER);
    console.log('[POSE-CHECK] 方向校准值版本过期（坐标推导已修正），已清空旧 zSign/xSign，本轮重新校准');
  }
} catch (e) {}
try { const _zs = localStorage.getItem('naixi_pose_zsign'); if (_zs) POSE_DEFAULTS.zSign = parseInt(_zs, 10) || 1; } catch (e) {}
try { const _xs = localStorage.getItem('naixi_pose_xsign'); if (_xs) POSE_DEFAULTS.xSign = parseInt(_xs, 10) || 1; } catch (e) {}
console.log(`[POSE-CHECK] 当前方向符号 zSign=${POSE_DEFAULTS.zSign} xSign=${POSE_DEFAULTS.xSign}`);
// ── 无头自验钩子：合成 Pose 注入 + 骨骼世界方向读回 ──
// 用途：验证「真人抬左手 → 模型 left 臂真的朝 +X」这类方向问题，**不需要用户在镜头前**。
// 设计要点：
//  1) 走 _driveArmsFromPose 真实链路（含 poseArmDirections / 平滑 / 限幅 / rotateBoneWorldDir），
//     绝不另写一套简化映射 —— 否则验证的是测试代码而不是产品代码。
//  2) 注入多帧让球面插值收敛（平滑 tau=0.13，单帧只走 30%）。
//  3) 读回的是**模型骨骼实际世界方向**，不是目标值 —— 目标反了模型会忠实执行，只比目标等于自欺。
window.__vrmPoseInject = (pose, vis, frames = 30, dt = 1 / 60) => {
  const armK = 1 - Math.exp(-Math.min(dt, 0.05) / ARM_SMOOTH_TAU);
  let dirs = null;
  for (let i = 0; i < frames; i++) dirs = _driveArmsFromPose(pose, vis, armK);
  return {
    xSign: POSE_DEFAULTS.xSign, zSign: POSE_DEFAULTS.zSign,
    tgt: dirs ? { left: dirs.left.u, right: dirs.right.u, visL: dirs.left.visible, visR: dirs.right.visible } : null,
  };
};
// 读回模型骨骼实际世界方向（肩→肘 / 肘→腕），以及各骨骼世界坐标（判定 left 到底在 +X 还是 -X）
window.__vrmArmProbe = () => {
  if (!vrm) return null;
  const g = (n) => bone(n);
  const dirOf = (a, b) => {
    if (!a || !b) return null;
    const d = worldPosOf(b).sub(worldPosOf(a));
    if (d.lengthSq() < 1e-12) return null;
    d.normalize();
    return { x: +d.x.toFixed(3), y: +d.y.toFixed(3), z: +d.z.toFixed(3) };
  };
  return {
    modelLeftXSign: MODEL_LEFT_X_SIGN,
    worldX: {
      leftUpperArm: +worldPosOf(g('leftUpperArm')).x.toFixed(3),
      rightUpperArm: +worldPosOf(g('rightUpperArm')).x.toFixed(3),
      leftHand: +worldPosOf(g('leftHand')).x.toFixed(3),
      rightHand: +worldPosOf(g('rightHand')).x.toFixed(3),
    },
    left: { u: dirOf(g('leftUpperArm'), g('leftLowerArm')), l: dirOf(g('leftLowerArm'), g('leftHand')) },
    right: { u: dirOf(g('rightUpperArm'), g('rightLowerArm')), l: dirOf(g('rightLowerArm'), g('rightHand')) },
  };
};
window.__vrmPoseConfig = (cfg = {}) => {
  if (cfg.armGain != null) POSE_DEFAULTS.armGain = cfg.armGain;
  if (cfg.zSign != null) POSE_DEFAULTS.zSign = cfg.zSign;
  if (cfg.chestYawGain != null) POSE_DEFAULTS.chestYawGain = cfg.chestYawGain;
  if (cfg.chestPitchGain != null) POSE_DEFAULTS.chestPitchGain = cfg.chestPitchGain;
  if (cfg.chestRollGain != null) POSE_DEFAULTS.chestRollGain = cfg.chestRollGain;
  if (cfg.torsoGain != null) POSE_DEFAULTS.torsoGain = cfg.torsoGain;
  if (cfg.torsoPitchGain != null) POSE_DEFAULTS.torsoPitchGain = cfg.torsoPitchGain;
  if (cfg.torsoRollGain != null) POSE_DEFAULTS.torsoRollGain = cfg.torsoRollGain;
  if (cfg.faceSmooth != null) FACE_SMOOTH_TAU = cfg.faceSmooth;
  if (cfg.headTau != null) HEAD_SMOOTH_TAU = cfg.headTau;    // 头还想更稳就调大（0.13→0.2 更绵）
  if (cfg.armTau != null) ARM_SMOOTH_TAU = cfg.armTau;       // 手臂仍抖就调大（0.13→0.2）
  return POSE_DEFAULTS;
};

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if (vrm) fitCamera();
});

// ── 中性基准重校（模拟 VTS "Calibrate" 按钮）── 用户坐好点「重置面捕原点」→ 采当前姿态为原点
window.__vrmRecenter = () => { _calibReset(); return 'recalibrating'; };
window.__vrmGetCalib = () => ({ calib: _calib, buf: _recenterBuf ? _recenterN : 0, requested: _recenterRequested });
// ── 无头自验专用：注入/清除合成 Pose、读 chest 实际旋转（默认无注入，不影响真机）──
window.__vrmSetInjected = (pose, headEuler, vis, bs) => { window.__vrmInjected = { pose, headEuler, vis, bs: bs || {} }; };
window.__vrmClearInjected = () => { window.__vrmInjected = null; };
// 无头自验专用：读 head 实际旋转、表情权重（默认 jawOpen）。页面内可访问 vrm，绕开模块作用域限制。
window.__vrmHeadProbe = () => {
  if (!vrm || !vrm.humanoid) return null;
  const h = vrm.humanoid.getNormalizedBoneNode('head');
  return h ? { x: +h.rotation.x.toFixed(3), y: +h.rotation.y.toFixed(3), z: +h.rotation.z.toFixed(3) } : null;
};
window.__vrmExprProbe = (name = 'aa') => {
  if (!vrm || !vrm.expressionManager) return null;
  const em = vrm.expressionManager;
  // arkitToVRM 把 jawOpen 映射成 VRM 表情名 'aa'/'oh'；getter 兼容不同 three-vrm 版本 getValue/getWeight
  const v = em.getValue ? em.getValue(name) : (em.getWeight ? em.getWeight(name) : null);
  return (v == null) ? null : +v.toFixed(3);
};
window.__vrmChestProbe = () => {
  if (!vrm || !vrm.humanoid) return null;
  const c = vrm.humanoid.getNormalizedBoneNode('upperChest') || vrm.humanoid.getNormalizedBoneNode('chest');
  if (!c) return null;
  return { x: +c.rotation.x.toFixed(3), y: +c.rotation.y.toFixed(3), z: +c.rotation.z.toFixed(3) };
};
console.log('[VRM] animate loop started');
</script>
</body>
