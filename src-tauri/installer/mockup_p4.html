<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>奶昔安装器 - 第4页 完成</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #e8e8e8;
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.window {
  width: 540px;
  height: 430px;
  background: #fff;
  border-radius: 8px;
  box-shadow: 0 10px 32px rgba(0,0,0,0.18);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.banner {
  width: 100%;
  height: 150px;
  object-fit: cover;
  display: block;
}
.content {
  flex: 1;
  padding: 22px 30px;
  position: relative;
}
h2 { font-size: 19px; color: #72243E; margin-bottom: 12px; font-weight: 600; }
p { font-size: 13px; color: #666; line-height: 1.7; margin-bottom: 8px; }
.btn {
  height: 30px;
  padding: 0 18px;
  border: none;
  border-radius: 5px;
  background: #D4537E;
  color: #fff;
  font-size: 13px;
  cursor: pointer;
}
.btn:hover { background: #b9446c; }
.btn.secondary { background: #F4C0D1; color: #72243E; }
.check-row { display: flex; align-items: center; gap: 6px; margin-top: 18px; font-size: 13px; color: #555; }
.footer {
  height: 62px;
  border-top: 1px solid #F4C0D1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 30px;
  background: #FDF8FA;
}
.steps { display: flex; gap: 14px; }
.step {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  color: #aaa;
}
.step .num {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #F4C0D1;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
}
.step.active { color: #D4537E; }
.step.active .num { background: #D4537E; }
.footer-btns { display: flex; gap: 10px; }
</style>
</head>
<body>
<div class="window">
  <img class="banner" src="banner_preview.png" alt="banner">
  <div class="content">
    <h2>安装完成</h2>
    <p>奶昔 · 桌面智能体 v0.1.0 已经安装完成。</p>
    <label class="check-row"><input type="checkbox" checked> 立即运行奶昔</label>
    <label class="check-row"><input type="checkbox" checked> 创建桌面快捷方式</label>
  </div>
  <div class="footer">
    <div class="steps">
      <div class="step active" data-i="1"><span class="num">1</span>欢迎</div>
      <div class="step active" data-i="2"><span class="num">2</span>位置</div>
      <div class="step active" data-i="3"><span class="num">3</span>安装</div>
      <div class="step active" data-i="4"><span class="num">4</span>完成</div>
    </div>
    <div class="footer-btns">
      <button class="btn secondary">上一步</button>
      <button class="btn">完成</button>
    </div>
  </div>
</div>
</body>
</html>
